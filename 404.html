<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Jeremy H. Bao</title>
    <!--
        GitHub Pages serves this file for any unknown path (e.g. /academics).
        We redirect to the root, encoding the original path in the query string,
        and index.html restores the clean URL. This keeps deep links working on
        a static host. Technique from https://github.com/rafgraph/spa-github-pages
    -->
    <script>
        (function () {
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.host + '/?/' +
                l.pathname.slice(1).replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        })();
    </script>
</head>

<body>
</body>

</html>
